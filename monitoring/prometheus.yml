# EchoServe P1 — Prometheus 配置
# 抓取 API 服务的 /metrics 端点

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "echoseve-monitor"

scrape_configs:
  - job_name: "echoseve-api"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "api:8080"
        labels:
          service: "echoseve-api"
          env: "production"

  - job_name: "vllm"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "vllm:8000"
        labels:
          service: "vllm"
          env: "production"

  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node-exporter"
          env: "production"
