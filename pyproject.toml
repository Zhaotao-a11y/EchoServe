[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "models", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (FastAPI Depends)
    "SIM108", # ternary vs if-else (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "plugins", "api", "config"]

[tool.ruff.format]
quote-style = "single"
